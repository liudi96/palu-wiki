# Redis生产环境配置

# 网络配置
bind 0.0.0.0
protected-mode yes
port 6379

# 常规配置
daemonize no
loglevel notice
logfile ""

# 持久化配置
save 900 1
save 300 10
save 60 10000

# RDB配置
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF配置
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# 内存管理
maxmemory-policy allkeys-lru
maxmemory-samples 5

# 客户端配置
timeout 0
tcp-keepalive 300
tcp-backlog 511

# 安全配置
# requireauth将通过环境变量动态设置

# 慢查询日志
slowlog-log-slower-than 10000
slowlog-max-len 128

# 其他配置
databases 16
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes